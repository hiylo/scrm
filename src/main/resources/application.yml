server:
  port: ${SERVER_PORT:8840}
  shutdown: graceful

spring:
  # 排除 Sentry 自动配置: sentry-spring-boot-starter-jakarta 8.x 的条件装配引用
  # org.springframework.boot.web.reactive.function.client.WebClientCustomizer,
  # 该类在 Spring Boot 4 中已迁移至 spring-webflux, 类内省失败会导致应用无法启动
  autoconfigure:
    exclude: io.sentry.spring.boot.jakarta.SentryAutoConfiguration
  mvc:
    async:
      # 长会话 / 批量导出请求超时 (毫秒)
      request-timeout: 600000
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  main:
    # 类路径同时存在 servlet 与 reactive 依赖 (WebClient 直连企业微信 API), 显式固定为 servlet 容器
    web-application-type: servlet
  application:
    name: scrm-server
  lifecycle:
    timeout-per-shutdown-phase: 30s
  task:
    scheduling:
      pool-size: 4
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scrm?currentSchema=scrm}
    username: ${SPRING_DATASOURCE_USERNAME:scrm}
    # 口令不写入仓库, 由环境变量或 docker-compose.yml 注入
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 120000
      pool-name: ScrmHikariPool
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: scrm
        jdbc:
          batch_size: 50
          time_zone: Asia/Shanghai
        order_inserts: true
        order_updates: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: scrm
    default-schema: scrm
    baseline-on-migrate: true
    baseline-version: 0
    # 合并版初始化脚本, 无需逐版本校验 checksum
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# 配置加密: master 密钥通过环境变量 JASYPT_ENCRYPTOR_PASSWORD 注入
jasypt:
  encryptor:
    algorithm: PBEWITHHMACSHA512ANDAES_256
    password: ${JASYPT_ENCRYPTOR_PASSWORD:}

# SCRM 服务配置
scrm:
  security:
    jwt:
      # 签名密钥生产环境必须通过环境变量注入, 占位值仅限本地开发
      secret: ${SCRM_JWT_SECRET:scrm-dev-only-change-me-in-production-0123456}
      # 访问令牌有效期 (秒, 默认 24 小时)
      expiration-seconds: ${SCRM_JWT_EXPIRATION_SECONDS:86400}
  # CORS 跨域配置, 逗号分隔
  cors:
    allowed-origins: ${SCRM_CORS_ALLOWED_ORIGINS:http://localhost:3002}
  # 平台账号 cookie / token 加密密钥 (16/24/32 字节), 生产环境必填
  account:
    encryption-key: ${SCRM_ACCOUNT_ENCRYPTION_KEY:}
  # 回调接口 (企微 / 任务状态 / 风险信号) X-Agent-Secret 共享密钥, 未配置时拒绝所有回调
  callback:
    agent-secret: ${SCRM_CALLBACK_AGENT_SECRET:}
  # 对象存储, 支持 MinIO (默认) 与阿里云 OSS, 凭证通过环境变量注入 (fail-closed)
  storage:
    provider: ${SCRM_STORAGE_PROVIDER:minio}
    endpoint: ${SCRM_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${SCRM_STORAGE_ACCESS_KEY:}
    secret-key: ${SCRM_STORAGE_SECRET_KEY:}
    bucket: ${SCRM_STORAGE_BUCKET:scrm-assets}
    secure: ${SCRM_STORAGE_SECURE:false}
    presign-expiry-seconds: ${SCRM_STORAGE_PRESIGN_EXPIRY_SECONDS:3600}
  # AI 自动回复服务, enabled=false 时客户端直接返回降级提示
  ai:
    enabled: ${SCRM_AI_ENABLED:false}
    base-url: ${SCRM_AI_BASE_URL:http://localhost:14000}
    model: ${SCRM_AI_MODEL:gpt-4o-mini}
    temperature: ${SCRM_AI_TEMPERATURE:0.7}
    max-tokens: ${SCRM_AI_MAX_TOKENS:500}
  # 接口限流默认参数 (可被 @RateLimit 注解覆盖)
  rate-limit:
    default-capacity: ${SCRM_RATE_LIMIT_CAPACITY:60}
    default-refill-tokens: ${SCRM_RATE_LIMIT_REFILL_TOKENS:60}
    default-refill-period-seconds: ${SCRM_RATE_LIMIT_REFILL_PERIOD:60}
  # 企微外部联系人同步配置
  wework:
    sync-interval-ms: ${SCRM_WEWORK_SYNC_INTERVAL_MS:1800000}
    # 企微回调 IP 白名单 (逗号分隔), 为空则跳过 IP 校验 (开发环境)
    callback-allowed-ips: ${WEWORK_CALLBACK_ALLOWED_IPS:}
    # 可信反向代理 IP 列表, 用于从 X-Forwarded-For 取真实客户端 IP
    trusted-proxy-ips: ${WEWORK_TRUSTED_PROXY_IPS:}
  # 营销自动化工作流配置
  workflow:
    # 延迟 (DELAY) 节点到期实例扫描间隔 (毫秒, 默认 60 秒)
    delay-resume-interval-ms: ${SCRM_WORKFLOW_DELAY_RESUME_INTERVAL_MS:60000}
  # 个推 (GeTui) 推送配置
  # enabled=false (默认) 时使用 NoOpPushNotificationService 占位, 仅记录日志不实际发送;
  # 凭证就绪后置 enabled=true, GeTuiPushNotificationService 自动注册, 调用方无需改动。
  # master-secret 支持 Jasypt ENC() 密文, 由上方 jasypt.encryptor.password 解密。
  push:
    getui:
      enabled: ${GETUI_ENABLED:false}
      app-key: ${GETUI_APP_KEY:}
      master-secret: ${GETUI_MASTER_SECRET:}
      base-url: ${GETUI_BASE_URL:https://restapi.getui.com}
      # 单次推送请求超时 (秒)
      timeout-seconds: ${GETUI_TIMEOUT_SECONDS:10}
      # token 提前刷新安全余量 (秒, 避免临界过期导致 401)
      token-refresh-advance-seconds: ${GETUI_TOKEN_REFRESH_ADVANCE_SECONDS:300}

# 雪花 ID 生成器: 多实例部署时每实例需配置不同的 worker-id / datacenter-id
sequence:
  worker-id: ${SEQUENCE_WORKER_ID:-1}
  datacenter-id: ${SEQUENCE_DATACENTER_ID:-1}

# 企业微信平台 SDK 配置
# 默认 mock 模式 (mock-mode=true, real-api-enabled=false), 仅返回假数据用于开发联调。
# 配置真实企微凭证后 (corp-id/agent-id/secret), 设置 WEWORK_REAL_API_ENABLED=true 切换为真实 API。
wework:
  corp-id: ${WEWORK_CORP_ID:mock_corp_id}
  agent-id: ${WEWORK_AGENT_ID:1000000}
  secret: ${WEWORK_SECRET:mock_secret}
  aes-key: ${WEWORK_AES_KEY:}
  token: ${WEWORK_CALLBACK_TOKEN:}
  base-url: ${WEWORK_BASE_URL:https://qyapi.weixin.qq.com/cgi-bin}
  real-api-enabled: ${WEWORK_REAL_API_ENABLED:false}
  mock-mode: ${WEWORK_MOCK_MODE:true}
  timeout: ${WEWORK_TIMEOUT:30000}
  retry-count: ${WEWORK_RETRY_COUNT:3}

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      group:
        liveness:
          include: diskSpace
        readiness:
          include: diskSpace,db
  metrics:
    export:
      prometheus:
        enabled: true

# 日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    org.hiylo.scrm: INFO
    org.springframework.web: INFO

# Sentry 异常上报 (生产环境通过环境变量注入 DSN, 未配置则不上报)
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: 1.0
  # 禁用 Sentry 的 HandlerExceptionResolver, 避免 Spring 6 兼容性问题
  # (ModelAndViewDefiningException 在 Spring 6 中已移除, Sentry 的异常解析器仍引用它)
  exception-resolver-enabled: false
